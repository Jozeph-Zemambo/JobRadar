spring:
  application:
    name: jobradar
  config:
    # Later imports win: a local ./profile.yml replaces the example profile.
    import: classpath:companies.yml, classpath:skills.yml, classpath:profile.example.yml, optional:file:./profile.yml
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:h2:file:./data/jobradar;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
  flyway:
    # Shared migrations plus per-database ones (e.g. Postgres partial indexes that H2 can't express).
    locations: classpath:db/migration,classpath:db/vendor/{vendor}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
